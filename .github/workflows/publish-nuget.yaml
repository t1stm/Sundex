name: Publish NuGet packages

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit prerelease version, for example 1.0.0-render.5'
        type: string
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version=$(build/version.sh stable)
          elif [ -n "$REQUESTED_VERSION" ]; then
            version=$(build/version.sh prerelease "$REQUESTED_VERSION")
          else
            version=$(build/version.sh)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
    secrets:
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - uses: actions/download-artifact@v4
        with:
          name: sundex-packages
          path: artifacts
      - uses: NuGet/login@v1
        id: login
        with:
          user: t1stm
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  github-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - uses: actions/download-artifact@v4
        with:
          name: sundex-packages
          path: artifacts
      # The packages link to this repository through RepositoryUrl. GitHub Packages takes no symbol packages.
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --name github --username "$GITHUB_ACTOR" --password "$GH_TOKEN" --store-password-in-clear-text
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --source github --api-key "$GH_TOKEN" --skip-duplicate --no-symbols
          done

  release-assets:
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sundex-packages
          path: artifacts
      - name: Attach packages to the release
        run: |
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            if ! grep -Fxq -- "${package##*/}" <<< "$existing"; then
              gh release upload "$GITHUB_REF_NAME" "$package"
            fi
          done
