name: Build packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      configuration:
        default: Release
        type: string
    secrets:
      SIXLABORS_LICENSE_KEY:
        required: false

permissions:
  contents: read

jobs:
  # miniaudio and the sundex_audio shim, per RID; the package ships them under runtimes/.
  audio-native:
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest, cc: gcc }
          - { rid: linux-arm64, os: ubuntu-latest, cc: aarch64-linux-gnu-gcc }
          - { rid: win-x64, os: windows-latest, cc: clang }
          - { rid: osx-arm64, os: macos-latest, cc: clang }
          - { rid: osx-x64, os: macos-latest, cc: clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the arm64 cross compiler
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        shell: bash
        run: sh build/audio-native.sh "${{ matrix.rid }}" "${{ matrix.cc }}"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-native-${{ matrix.rid }}
          path: Sundex.Engine/Audio/Native/runtimes/
          if-no-files-found: error

  build:
    needs: audio-native
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CONFIGURATION: ${{ inputs.configuration }}
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-native-*
          path: Sundex.Engine/Audio/Native/runtimes/
          merge-multiple: true
      - name: Check the native audio libraries
        run: |
          for library in linux-x64/native/libsundex_audio.so linux-arm64/native/libsundex_audio.so \
            win-x64/native/sundex_audio.dll osx-arm64/native/libsundex_audio.dylib osx-x64/native/libsundex_audio.dylib; do
            test -f "Sundex.Engine/Audio/Native/runtimes/$library"
          done
      - name: Check OpenGL backend boundary
        run: |
          if git grep -n -F 'OpenTK.Graphics.OpenGL' -- '*.cs' ':(exclude)Sundex.Engine/Renderer/OpenGL/**'; then
            exit 1
          fi
      - name: Build, test and pack
        run: |
          dotnet build Sundex.slnx -c "$CONFIGURATION" -p:Version="$VERSION"
          dotnet test --solution Sundex.slnx -c "$CONFIGURATION" --no-build
          dotnet pack Sundex.slnx -c "$CONFIGURATION" --no-build -p:Version="$VERSION" -o artifacts
          test "$(find artifacts -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 11
          test "$(find artifacts -maxdepth 1 -name '*.snupkg' | wc -l)" -eq 11
      - uses: actions/upload-artifact@v4
        with:
          name: sundex-packages
          path: artifacts/
          if-no-files-found: error
